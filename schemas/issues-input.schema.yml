$schema: https://json-schema.org/draft/2020-12/schema
$id: https://zipzap.local/schemas/issues-input.schema.yml
title: 问题项 consolidation input
type: object
additionalProperties: false
required: [schema_version, issues]
properties:
  schema_version: { const: 2 }
  issues:
    type: array
    items: { $ref: "#/$defs/issue" }
$defs:
  issue:
    type: object
    additionalProperties: false
    required: [fingerprint, checkpoint, title, severity, return_to]
    properties:
      fingerprint: { type: string, minLength: 1 }
      checkpoint: { type: string, minLength: 1 }
      title: { type: string, minLength: 1 }
      severity: { enum: [low, medium, high] }
      status: { enum: [open, resolved, closed] }
      return_to: { enum: [direct, plan, design, implement, verify, deploy, maintain] }
      verification_ref: { type: string, minLength: 1 }
      bootstrap_gap: { type: boolean }
      standard_target: { type: string, pattern: "^standards/(foundation|engineering|quality|delivery|governance)/.+\\.md$" }
    allOf:
      - if:
          properties:
            status: { const: closed }
          required: [status]
        then:
          required: [verification_ref]
  proposal:
    type: object
    additionalProperties: false
    required: [fingerprint, action, status]
    properties:
      blocks_work: { type: boolean, default: false }
      fingerprint: { type: string, minLength: 1 }
      target:
        anyOf:
          - { type: string, pattern: "^(AGENTS\\.md|standards/(foundation|engineering|quality|delivery|governance)/.+\\.md)$" }
          - { type: "null" }
      action: { enum: [merge, decide-target, propose-revision] }
      status: { enum: [proposed, approved, applied, closed] }
      evidence_ref: { type: string, minLength: 1 }
      instruction: { type: string, minLength: 1 }
      auto_apply: { type: boolean }
      agents_md_allowed: { type: boolean }
    allOf:
      - if:
          properties:
            status: { enum: [approved, applied, closed] }
          required: [status]
        then:
          required: [evidence_ref]
