$schema: https://json-schema.org/draft/2020-12/schema
$id: https://zipzap.local/schemas/legacy-cleanup-input.schema.yml
title: Legacy Task state cleanup input
type: object
additionalProperties: false
required: [schema_version, project]
properties:
  schema_version: { const: 1 }
  project:
    type: object
    additionalProperties: false
    required: [locator]
    properties:
      locator: { type: string, minLength: 1 }
  confirmation:
    type: object
    additionalProperties: false
    required: [preview_fingerprint]
    properties:
      preview_fingerprint: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
