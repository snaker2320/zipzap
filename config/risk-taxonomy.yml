schema_version: 1
signals:
  ambiguous-material-requirements:
    risk: medium
    effects:
      persistence_required: false
      required_evidence:
        - resolved-requirement-decision
      required_gates:
        - peer-challenge
      requires_approval:
        - product-or-domain-owner
      risk_flags: []
    summary: Material behavior or acceptance criteria remain ambiguous and different interpretations
      have meaningful consequences.
  authority-or-external-communication:
    risk: medium
    effects:
      persistence_required: true
      required_evidence:
        - authorized-decision
      required_gates:
        - second-context
      requires_approval:
        - authorized-human
      risk_flags: []
    summary: The work sends external communication or requires credentials, authority, risk acceptance,
      or a binding human decision.
  difficult-to-reverse:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - rollback-or-recovery-plan
      required_gates: []
      requires_approval: []
      risk_flags:
        - difficult-to-reverse
    summary: Recovery is costly, uncertain, slow, or requires coordinated migration or repair.
  external-user-impact:
    risk: medium
    effects:
      persistence_required: true
      required_evidence:
        - user-impact-validation
      required_gates:
        - independent-testing-from-authors
        - independent-review-from-authors
      requires_approval: []
      risk_flags: []
    summary: The work changes externally visible behavior or can materially affect users.
  financial-impact:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - financial-calculation-tests
        - reconciliation-evidence
      required_gates:
        - independent-testing-from-authors
        - independent-review-from-authors
        - review-independent-from-testing
      requires_approval:
        - business-or-financial-owner
      risk_flags: []
    summary: The work can change monetary values, settlement, billing, limits, accounting, or financial
      decisions.
  privacy-or-regulated-data:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - data-scope
        - privacy-or-compliance-validation
      required_gates: []
      requires_approval:
        - data-owner-or-compliance
      risk_flags:
        - regulated-data
    summary: The work accesses, changes, exposes, or governs personal, confidential, or regulated data.
  production-destructive:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - recovery-plan
        - rollback-or-restore-evidence
      required_gates: []
      requires_approval:
        - production-owner
      risk_flags:
        - production-destructive
    summary: The requested action can delete, overwrite, corrupt, or irreversibly mutate production state.
  security-critical:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - threat-analysis
        - security-tests
      required_gates: []
      requires_approval:
        - security-owner
      risk_flags:
        - security-critical
    summary: The work affects authentication, authorization, secrets, trust boundaries, or exploitable
      security behavior.
  shared-interface-or-migration:
    risk: high
    effects:
      persistence_required: true
      required_evidence:
        - compatibility-tests
        - migration-and-rollback-plan
      required_gates: []
      requires_approval: []
      risk_flags:
        - difficult-to-reverse
    summary: The work changes a shared contract, schema, protocol, migration, or broad dependency surface.
  unfamiliar-technology:
    risk: medium
    effects:
      persistence_required: false
      required_evidence:
        - technology-specific-validation
      required_gates:
        - peer-challenge
        - independent-testing-from-authors
      requires_approval: []
      risk_flags: []
    summary: The active executor lacks reliable experience or project evidence for the affected technology.
  weak-or-missing-verification:
    risk: medium
    effects:
      persistence_required: false
      required_evidence:
        - proportionate-test-plan
      required_gates:
        - independent-testing-from-authors
        - independent-review-from-authors
      requires_approval: []
      risk_flags: []
    summary: Objective validation is absent, unreliable, or does not cover the affected behavior.
