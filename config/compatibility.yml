schema_version: 1
interfaces:
  workflow:
    current: 3
  handoff:
    current: 2
  delivery:
    current: 1
host_features:
  required:
    - project-read
    - git-read
    - json-read
  optional:
    - project-write
    - script-execution
    - request-user-input
    - request-user-input-async
    - multi-agent
    - stable-agent-identity
    - handoff-acknowledgement
decision_forms:
  tool_preference: [request_user_input, request_user_input_async]
  native_max_questions: 3
  fallback: stepwise-text
  availability: host-and-mode-specific
policies:
  no_governance_downgrade: true
  no_false_independence_claims: true
  same_contracts_for_json_and_yml_input: true
  dynamic_output_format: json
