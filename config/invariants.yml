assurance_claims:
  - implemented
  - verified
  - tested
  - self-reviewed
  - peer-challenged
  - independently-reviewed
  - accepted
  - blocked
  - completed
invariants:
  - id: execution-profile-separation
    rule: Keep Work ownership and independent-check identity separate from named Agent Profiles.
  - id: owner-check-independence
    rule: Bind Owner and independent checks to Host-provided Agent identities; an Owner or artifact author cannot perform an independent check.
  - id: host-orchestration
    rule: Keep assignment, liveness, message delivery, handoff acceptance, and progress derivation in the Host; do not create an Orchestrator Agent.
  - id: personalization-governance-boundary
    rule: Do not let personalization change authority, rules, gates, evidence, or independence.
  - id: project-rule-single-source
    rule: Keep project-specific rules at their authoritative project source.
  - id: project-independence
    rule: Projects remain usable without ZipZap; assistance does not imply a Loop, installation does not initialize or relocate rules, and unavailable required checks still block their delivery boundary.
  - id: git-checkpoint-handoff
    rule: Use a structured final Git commit and base..HEAD as the durable handoff source.
  - id: truthful-assurance
    rule: Do not label self-review, peer challenge, or co-authored work as independent review.
  - id: evidence-backed-completion
    rule: Support completion claims with applicable evidence and gate state.
  - id: explicit-work-boundary
    rule: Direct Work has no SDLC stage; staged Work declares its completion stage and advances only explicitly.
  - id: minimal-runtime-context
    rule: Inject the smallest sufficient runtime projection and recompose it when governing inputs
      change.
schema_version: 1
standard_stages:
  - frame
  - plan
  - produce
  - verify
  - self-review
  - review
  - resolve
  - accept
  - complete
  - handoff
