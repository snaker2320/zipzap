order:
  - solo
  - copilot
  - trio
  - squad
schema_version: 1
runtime:
  activation: lazy
  reuse_key: loop-id-and-slot
  after_step: idle
  retain: activated-slots-until-workflow-complete
  release_on:
    - workflow-complete
    - external-handoff
    - scope-or-risk-recomposed
  replace_on:
    - independence-invalidated
    - context-no-longer-reliable
    - host-capacity-required
  durable_recovery: git-checkpoint
teams:
  copilot:
    assurance:
      peer_challenge: true
      product_separate_from_coordinator: false
      reviewer_separate_from_developer: false
      reviewer_separate_from_tester: false
      second_context: true
      tester_separate_from_developer: false
    avoid_when:
      - Formal independent testing or review is required.
    degradation:
      fallback: solo
      on_assurance_gap: Upgrade to Trio or Squad or add a distinct qualified human or Agent gate.
      on_member_unavailable: Disclose loss of second-context challenge.
    display_name: Copilot
    host_slot: pilot
    members:
      - functions:
          - coordinator
        profile: wolf
        roles:
          - product
          - developer
          - tester
          - reviewer
        slot: pilot
      - artifact_access: read-only
        functions:
          - advisor
        profile: eagle
        roles: []
        slot: copilot
    schedule_waves:
      - - pilot
      - - copilot
    select_when:
      - Everyday low-to-normal-risk execution benefits from continuous second-context challenge
        without a formal independent gate.
    summary: One primary Agent executes while a second context accompanies, challenges, and advises.
  solo:
    assurance:
      peer_challenge: false
      product_separate_from_coordinator: false
      reviewer_separate_from_developer: false
      reviewer_separate_from_tester: false
      second_context: false
      tester_separate_from_developer: false
    avoid_when:
      - Independent review, separation of duties, adversarial testing, specialized authority, or
        material risk acceptance is required.
    degradation:
      fallback: null
      on_assurance_gap: Upgrade to Trio or Squad, add a distinct human or Agent gate, or stop with the gap disclosed.
    display_name: Solo
    host_slot: primary
    members:
      - functions:
          - coordinator
        profile: owl
        roles:
          - product
          - developer
          - tester
          - reviewer
        slot: primary
    schedule_waves:
      - - primary
    select_when:
      - Work is bounded, reversible, low risk, objectively verifiable, and needs no independent gate.
    summary: One adaptive profile executes roles sequentially with explicit boundaries.
  squad:
    assurance:
      peer_challenge: true
      product_separate_from_coordinator: true
      reviewer_separate_from_developer: true
      reviewer_separate_from_tester: true
      second_context: true
      tester_separate_from_developer: true
    avoid_when:
      - Fewer contexts satisfy the required outcome and gates.
    degradation:
      fallback: null
      on_assurance_gap: Reassign to a distinct profile or human with provenance, otherwise stop the affected gate.
    display_name: Squad
    host_slot: coordinator
    members:
      - functions:
          - coordinator
        profile: owl
        roles: []
        slot: coordinator
      - functions: []
        profile: fox
        roles:
          - product
        slot: product
      - functions: []
        profile: wolf
        roles:
          - developer
        slot: builder
      - functions: []
        profile: lynx
        roles:
          - tester
        slot: verifier
      - functions: []
        profile: eagle
        roles:
          - reviewer
        slot: reviewer
    schedule_waves:
      - - coordinator
        - product
      - - coordinator
        - builder
      - - coordinator
        - verifier
      - - coordinator
        - reviewer
    select_when:
      - Work is high risk, broad, complex, regulated, difficult to reverse, or requires full role
        separation.
    summary: A full specialist team separating coordination, product, development, testing, and review.
  trio:
    assurance:
      peer_challenge: true
      product_separate_from_coordinator: false
      reviewer_separate_from_developer: true
      reviewer_separate_from_tester: false
      second_context: true
      tester_separate_from_developer: true
    avoid_when:
      - Testing and review must be mutually independent or Product must be separate from
        coordination.
    degradation:
      fallback: null
      on_assurance_gap: Substitute another distinct profile or human, upgrade to Squad, or stop the affected gate.
    display_name: Trio
    host_slot: coordinator
    members:
      - functions:
          - coordinator
        profile: owl
        roles:
          - product
        slot: coordinator
      - functions: []
        profile: wolf
        roles:
          - developer
        slot: builder
      - functions: []
        profile: eagle
        roles:
          - tester
          - reviewer
        slot: assurance
    schedule_waves:
      - - coordinator
      - - builder
      - - assurance
    select_when:
      - Normal collaborative or persistent delivery needs testing and review separated from
        development.
    summary: A compact delivery team separating implementation from assurance.
